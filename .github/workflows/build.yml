name: Chupa Loops build (Mac + Windows)

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ "**.md", "docs/*.png" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chupa-loops-build
  cancel-in-progress: true

# Optional signing secrets (Settings > Secrets and variables > Actions). Without them the build is
# ad-hoc signed and the installers are unsigned (they still work, with a Gatekeeper / SmartScreen warning).
#   MACOS_APP_CERT_P12        base64 of your "Developer ID Application" certificate (.p12)
#   MACOS_INSTALLER_CERT_P12  base64 of your "Developer ID Installer" certificate (.p12)
#   MACOS_CERT_PASSWORD       password of both .p12 files
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarization (app-specific password)
#   Windows, option A (recommended, required for most new certificates): Azure Trusted Signing
#     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TS_ENDPOINT, AZURE_TS_ACCOUNT, AZURE_TS_PROFILE
#   Windows, option B (older exportable certificates only): WINDOWS_CERT_PFX (base64 .pfx), WINDOWS_CERT_PASSWORD

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      HAS_APP_CERT: ${{ secrets.MACOS_APP_CERT_P12 != '' }}
      HAS_INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
      ART: build/ChupaLoops_artefacts/Release

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Configure (universal: Apple Silicon + Intel)"
        run: |
          rm -rf build
          cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
                -DSLICETRIBE_BUILD_TESTS=ON -DCHUPALOOPS_UPDATE_REPO="${{ github.repository }}"

      - name: "Build"
        run: cmake --build build --config Release --target ChupaLoops_VST3 ChupaLoops_AU ChupaLoops_Standalone -- -quiet

      - name: "Version"
        # same scheme as CMakeLists.txt: build 1..255 = 1.1.x, 256 = 1.2.0 ...
        run: echo "VERSION=1.$((1 + ${{ github.run_number }} / 256)).$((${{ github.run_number }} % 256))" >> "$GITHUB_ENV"

      - name: "Import signing certificates"
        if: env.HAS_APP_CERT == 'true'
        env:
          APP_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          if [ -n "$INSTALLER_P12" ]; then
            echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          APP_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          INST_ID=$(security find-identity -v "$KEYCHAIN" | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)"/\1/' || true)
          echo "APP_IDENTITY=$APP_ID" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INST_ID" >> "$GITHUB_ENV"

      - name: "Sign"
        run: |
          for b in "$ART/VST3/Chupa Loops.vst3" "$ART/AU/Chupa Loops.component" "$ART/Standalone/Chupa Loops.app"; do
            if [ -n "${APP_IDENTITY:-}" ]; then
              codesign --force --options runtime --timestamp --sign "$APP_IDENTITY" "$b"
            else
              codesign --force --deep --sign - "$b"
            fi
            codesign --verify --verbose "$b"
          done

      - name: "Installer (.pkg)"
        run: |
          chmod +x installer/mac/scripts/postinstall   # the execute bit is lost when files are uploaded via the web
          bash installer/mac/build_installer.sh "$ART" "$VERSION" dist "${INSTALLER_IDENTITY:-}"

      - name: "Notarize installer"
        if: env.HAS_NOTARY == 'true' && env.HAS_APP_CERT == 'true' && env.HAS_INSTALLER_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash installer/mac/notarize.sh "dist/Chupa Loops Installer.pkg"

      - name: "Disk image (.dmg) and zip"
        run: |
          mkdir -p dmg
          cp "dist/Chupa Loops Installer.pkg" dmg/
          [ -f "docs/Chupa Loops Manual.pdf" ] && cp "docs/Chupa Loops Manual.pdf" dmg/
          for i in 1 2 3; do   # hdiutil is sometimes "busy" on CI runners
            hdiutil create -volname "Chupa Loops" -srcfolder dmg -ov -format UDZO ChupaLoops-macOS.dmg && break
            sleep 5
          done
          [ -f ChupaLoops-macOS.dmg ]
          if [ -n "${APP_IDENTITY:-}" ]; then codesign --force --timestamp --sign "$APP_IDENTITY" ChupaLoops-macOS.dmg; fi
          # plain zip for manual installs (no admin rights needed)
          mkdir -p "zip/Chupa Loops"
          cp -R "$ART/VST3/Chupa Loops.vst3" "$ART/AU/Chupa Loops.component" "$ART/Standalone/Chupa Loops.app" "zip/Chupa Loops/"
          cp "installer/Install Chupa Loops.command" "zip/Chupa Loops/"
          chmod +x "zip/Chupa Loops/Install Chupa Loops.command"
          [ -f "docs/Chupa Loops Manual.pdf" ] && cp "docs/Chupa Loops Manual.pdf" "zip/Chupa Loops/"
          (cd zip && ditto -c -k --sequesterRsrc --keepParent "Chupa Loops" ../ChupaLoops-macOS.zip)

      - name: "Notarize disk image"
        if: env.HAS_NOTARY == 'true' && env.HAS_APP_CERT == 'true' && env.HAS_INSTALLER_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash installer/mac/notarize.sh ChupaLoops-macOS.dmg

      - name: "Upload build"
        uses: actions/upload-artifact@v4
        with:
          name: ChupaLoops-macOS
          path: |
            ChupaLoops-macOS.dmg
            ChupaLoops-macOS.zip

      # ---- quality checks (logged; they never block the download) ----
      - name: "Check: engine tests"
        continue-on-error: true
        run: |
          cmake --build build --config Release --target RenderTest -- -quiet
          mkdir -p testrun && cd testrun
          ../build/RenderTest_artefacts/Release/RenderTest

      - name: "Check: Apple AU validation (auval)"
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components ~/Library/Audio/Plug-Ins/VST3
          cp -R "$ART/AU/Chupa Loops.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "$ART/VST3/Chupa Loops.vst3" ~/Library/Audio/Plug-Ins/VST3/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -a > /dev/null || true
          auval -v aumu Chup Prcp

      - name: "Check: pluginval"
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate "$ART/VST3/Chupa Loops.vst3"

      - name: "Clean up keychain"
        if: always() && env.HAS_APP_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_TS_ACCOUNT != '' }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Configure"
        run: cmake -B build -A x64 -DCHUPALOOPS_UPDATE_REPO="${{ github.repository }}"

      - name: "Build"
        run: cmake --build build --config Release --target ChupaLoops_VST3 ChupaLoops_Standalone

      - name: "Collect files"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/win" | Out-Null
          Copy-Item -Recurse "build/ChupaLoops_artefacts/Release/VST3/Chupa Loops.vst3" "dist/win/"
          Copy-Item "build/ChupaLoops_artefacts/Release/Standalone/Chupa Loops.exe" "dist/win/"
          if (Test-Path "docs/Chupa Loops Manual.pdf") { Copy-Item "docs/Chupa Loops Manual.pdf" "dist/win/" }

      - name: "Version"
        shell: bash
        run: echo "VERSION=1.$((1 + ${{ github.run_number }} / 256)).$((${{ github.run_number }} % 256))" >> "$GITHUB_ENV"

      - name: "Sign (Azure Trusted Signing)"
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\win
          files-folder-filter: exe,vst3
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: "Sign (code-signing certificate)"
        if: env.HAS_WIN_CERT == 'true' && env.HAS_AZURE_SIGNING != 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -Last 1
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $files = @("dist/win/Chupa Loops.exe") + (Get-ChildItem "dist/win/Chupa Loops.vst3" -Recurse -Filter "*.vst3" -File | ForEach-Object { $_.FullName })
          foreach ($f in $files) {
            & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:PFX_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$f"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: "Installer (Inno Setup)"
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName }
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -Last 1).FullName
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=..\..\dist\win" "/DOutputDir=..\..\dist" "installer\windows\ChupaLoops.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force -Path "setup" | Out-Null
          Move-Item "dist/ChupaLoops-Windows-Setup.exe" "setup/ChupaLoops-Windows-Setup.exe"

      - name: "Sign installer (Azure Trusted Signing)"
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}\setup
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: "Sign installer"
        if: env.HAS_WIN_CERT == 'true' && env.HAS_AZURE_SIGNING != 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:PFX_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "setup/ChupaLoops-Windows-Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"

      - name: "Zip (manual install)"
        shell: pwsh
        run: |
          Move-Item "setup/ChupaLoops-Windows-Setup.exe" "ChupaLoops-Windows-Setup.exe"
          New-Item -ItemType Directory -Force -Path "zip/Chupa Loops" | Out-Null
          Copy-Item -Recurse "dist/win/*" "zip/Chupa Loops/"
          Copy-Item "installer/Install on Windows.txt" "zip/Chupa Loops/"
          Compress-Archive -Path "zip/Chupa Loops" -DestinationPath ChupaLoops-Windows.zip

      - name: "Upload build"
        uses: actions/upload-artifact@v4
        with:
          name: ChupaLoops-Windows
          path: |
            ChupaLoops-Windows-Setup.exe
            ChupaLoops-Windows.zip

  release:
    needs: [ macos, windows ]
    # publish only when the Mac build worked (the Windows files are added when they are there too)
    if: ${{ !cancelled() && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: "Download builds"
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: "Publish on the Releases page"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WINDOWS_OK: ${{ needs.windows.result == 'success' }}
          TITLE: "Chupa Loops (latest build #${{ github.run_number }})"
          NOTES: "Mac: ChupaLoops-macOS.dmg (installer: VST3 + Audio Unit + standalone app). Windows: ChupaLoops-Windows-Setup.exe (VST3 + standalone app). The .zip files are for manual installs. Built from ${{ github.sha }}."
        run: |
          # update the existing release in place, so there is never a moment without a download
          if gh release view latest > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="${{ github.sha }}" -F force=true
            gh release upload latest artifacts/ChupaLoops-* --clobber
            # remove files that this build did not make (old names, or Windows files when the Windows build failed)
            gh release view latest --json assets -q '.assets[].name' | while read -r old; do
              if [ ! -f "artifacts/$old" ]; then gh release delete-asset latest "$old" --yes || true; fi
            done
            if [ "$WINDOWS_OK" != "true" ]; then NOTES="$NOTES (The Windows build failed this time: Windows files are missing from this release.)"; fi
            gh release edit latest --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create latest artifacts/ChupaLoops-* --target "${{ github.sha }}" --title "$TITLE" --notes "$NOTES" --latest
          fi
